apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: web

spec:
  serviceName: "sts-nginx-headless"
  replicas: 3

  selector:
    matchLabels:
      applabel: nginx

  template:
    metadata:
      labels:
        applabel: nginx

    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80